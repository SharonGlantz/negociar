<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gracias — Saber Negociar</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=boska@400,500&f[]=switzer@400,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --papel:#F2F0EB; --tinta:#191C1E; --oxido:#7E2B32; --pizarra:#5E6A6E; --linea:#D6D2C9;
  --display:'Boska','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --cuerpo:'Switzer','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:clamp(1.25rem,5vw,2.5rem);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  margin:0;
  min-height:100svh;
  display:grid;
  place-content:center;
  gap:1.5rem;
  padding:clamp(2rem,10vh,5rem) max(var(--gutter),env(safe-area-inset-left)) clamp(2rem,10vh,5rem) max(var(--gutter),env(safe-area-inset-right));
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--cuerpo);
  font-size:1.125rem;
  line-height:1.7;
  text-wrap:pretty;
}
.wrap{width:min(52ch,100%);margin-inline:auto;}
.eyebrow{
  font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pizarra);margin:0 0 1.5rem;
}
h1{
  font-family:var(--display);
  font-size:clamp(2.25rem,6vw,3.5rem);
  font-weight:500;line-height:1.05;letter-spacing:-.02em;margin:0;
}
p{margin:1.4rem 0 0;}
.pizarra{color:var(--pizarra);}
.volver{
  display:inline-block;margin-top:2.5rem;
  font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tinta);
  text-decoration:none;border-bottom:1px solid var(--linea);
  padding-block:.5rem;
}
.volver:hover{border-bottom-color:var(--tinta);}
a:focus-visible{outline:2px solid var(--oxido);outline-offset:3px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Listo</p>
  <h1>Ya estás adentro.</h1>
  <p>Te llega un mail con el acceso al curso en los próximos minutos.</p>
  <p class="pizarra">Si no lo ves, revisá spam o promociones antes de escribirnos — casi siempre está ahí.</p>
  <a class="volver" href="../">Volver al inicio</a>
</div>
</body>
</html>
